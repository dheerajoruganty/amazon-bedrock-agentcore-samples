# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json

project_name: amazon-bedrock-agentcore-samples

global_settings:
  severity_threshold: MEDIUM
  fail_on_findings: false  # Don't fail CI, just report
  ignore_paths: []

scanners:
  bandit:
    enabled: true
    options:
      confidence_level: MEDIUM
      severity_level: medium

  semgrep:
    enabled: true
    options:
      rules: ['p/ci', 'p/security-audit']
      timeout: 300

  detect-secrets:
    enabled: true
    options:
      exclude_lines: []

  checkov:
    enabled: true
    options:
      framework: ['all']

  cfn-nag:
    enabled: true

  cdk-nag:
    enabled: true
    options:
      nag_packs: ['AWS_SOLUTIONS']

  npm-audit:
    enabled: true
    options:
      audit_level: moderate

  grype:
    enabled: true
    options:
      severity: medium

  syft:
    enabled: true

reporters:
  markdown:
    enabled: true
    options:
      include_detailed_findings: true
      max_detailed_findings: 1000  # Show all findings instead of default 20

  json:
    enabled: true
    options:
      pretty_print: true

  sarif:
    enabled: true
    options:
      include_help_uri: true